<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent Switchboard workflow</title>
  <desc id="desc">Codex session logs flow through a WSL monitor into ntfy, then into a Windows Electron dashboard that can focus the matching target window through the focus protocol.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <linearGradient id="appGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="560" rx="22" fill="#f8fafc"/>
  <rect x="28" y="28" width="1064" height="504" rx="20" fill="#ffffff" stroke="#dbe3ec"/>

  <text x="64" y="86" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Agent Switchboard at a glance</text>
  <text x="64" y="118" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">A small Windows dashboard for seeing active Codex sessions and jumping back to the right window.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="182" width="160" height="120" rx="14" fill="#f1f5f9" stroke="#cbd5e1" filter="url(#shadow)"/>
    <text x="150" y="222" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Codex</text>
    <text x="150" y="249" text-anchor="middle" fill="#475569" font-size="14">session logs</text>
    <text x="150" y="271" text-anchor="middle" fill="#64748b" font-size="13">rollout-*.jsonl</text>

    <rect x="298" y="182" width="170" height="120" rx="14" fill="#ecfdf5" stroke="#bbf7d0" filter="url(#shadow)"/>
    <text x="383" y="219" text-anchor="middle" fill="#064e3b" font-size="19" font-weight="700">WSL monitor</text>
    <text x="383" y="247" text-anchor="middle" fill="#166534" font-size="14">detects status</text>
    <text x="383" y="269" text-anchor="middle" fill="#15803d" font-size="13">publishes events</text>

    <rect x="536" y="182" width="150" height="120" rx="14" fill="#fff7ed" stroke="#fed7aa" filter="url(#shadow)"/>
    <text x="611" y="219" text-anchor="middle" fill="#7c2d12" font-size="20" font-weight="700">ntfy.sh</text>
    <text x="611" y="247" text-anchor="middle" fill="#9a3412" font-size="14">shared topic</text>
    <text x="611" y="269" text-anchor="middle" fill="#c2410c" font-size="13">optional auth</text>

    <rect x="754" y="168" width="210" height="148" rx="16" fill="url(#appGrad)" stroke="#bae6fd" filter="url(#shadow)"/>
    <text x="859" y="207" text-anchor="middle" fill="#0c4a6e" font-size="20" font-weight="700">Electron app</text>
    <rect x="784" y="229" width="150" height="16" rx="5" fill="#38bdf8"/>
    <rect x="784" y="256" width="118" height="14" rx="5" fill="#94a3b8"/>
    <rect x="784" y="281" width="134" height="14" rx="5" fill="#94a3b8"/>

    <rect x="456" y="382" width="210" height="88" rx="14" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="561" y="418" text-anchor="middle" fill="#581c87" font-size="18" font-weight="700">focus: protocol</text>
    <text x="561" y="445" text-anchor="middle" fill="#7e22ce" font-size="14">focus:&lt;window_name&gt;</text>

    <rect x="754" y="382" width="210" height="88" rx="14" fill="#fef2f2" stroke="#fecaca"/>
    <text x="859" y="418" text-anchor="middle" fill="#7f1d1d" font-size="18" font-weight="700">Target window</text>
    <text x="859" y="445" text-anchor="middle" fill="#991b1b" font-size="14">Cursor, terminal, browser</text>
  </g>

  <g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 230 242 H 288"/>
    <path d="M 468 242 H 526"/>
    <path d="M 686 242 H 744"/>
    <path d="M 859 316 C 859 356 652 344 592 379"/>
    <path d="M 666 426 H 744"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">
    <text x="259" y="224" text-anchor="middle">tail</text>
    <text x="497" y="224" text-anchor="middle">publish</text>
    <text x="716" y="224" text-anchor="middle">subscribe</text>
    <text x="742" y="356" text-anchor="middle">open row</text>
    <text x="705" y="411" text-anchor="middle">activate</text>
  </g>

  <rect x="70" y="360" width="300" height="110" rx="14" fill="#f8fafc" stroke="#dbe3ec"/>
  <text x="94" y="395" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Configuration surface</text>
  <text x="94" y="424" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">One ntfy topic connects the publisher and app.</text>
  <text x="94" y="448" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Use config/noti_ntfy.env.example as the template.</text>
</svg>
